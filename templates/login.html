<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acesso ao Sistema</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0px 4px 20px rgba(0,0,0,0.08); width: 320px; }
        h2 { text-align: center; color: #333; margin-bottom: 24px; }
        label { font-weight: bold; color: #555; font-size: 14px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #0056b3; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #004085; }
        .erro { color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 4px; text-align: center; font-size: 14px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Acesso Restrito</h2>
    {% if erro %}
        <div class="erro">{{ erro }}</div>
    {% endif %}
    <form action="/login" method="POST">
        <label>Usuário:</label>
        <input type="text" name="usuario" required autocomplete="off">
        
        <label>Senha:</label>
        <input type="password" name="senha" required>
        
        <button type="submit">Entrar no Painel</button>
    </form>
</div>

</body>
</html>
