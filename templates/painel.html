<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel</title>
    <style>
        body { background: #0f1015; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 30px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 15px;}
        .busca { display: flex; flex: 1; max-width: 400px; background: #1e1e28; border-radius: 8px; border: 1px solid #333; overflow: hidden; }
        .busca input { background: transparent; border: none; color: white; padding: 12px; width: 100%; outline: none; }
        .busca button { background: transparent; border: none; color: #4f46e5; padding: 0 15px; cursor: pointer; font-weight: bold;}
        
        .ferramentas { display: flex; gap: 10px; }
        .btn { padding: 10px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; font-size: 14px;}
        .btn-acao { background: #2d2d3a; color: #a1a1aa; }
        .btn-acao:hover { background: #3f3f5a; color: white; }
        .btn-novo { background: #4f46e5; color: white; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: #1a1b23; border: 1px solid #2d2d3a; border-radius: 12px; padding: 20px; display: flex; gap: 15px; align-items: center; position: relative; transition: 0.2s; cursor: pointer;}
        .card:hover { transform: translateY(-3px); border-color: #4f46e5; }
        .card img { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid #4f46e5; }
        
        .info { flex: 1; }
        .info h3 { margin: 0 0 5px 0; font-size: 16px; color: #fff; line-height: 1.2; padding-right: 45px; }
        .info p { margin: 2px 0; font-size: 13px; color: #888; }
        .prontuario { color: #ff4757 !important; font-weight: bold; }
        
        .acoes-card { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; align-items: center; z-index: 10; }
        
        .btn-lixeira, .btn-editar { background: transparent; border: none; font-size: 16px; cursor: pointer; opacity: 0.3; transition: 0.2s; text-decoration: none; padding: 0; }
        .card:hover .btn-lixeira, .card:hover .btn-editar { opacity: 1; }
        .btn-editar:hover { transform: scale(1.15); }
        .btn-lixeira:hover { transform: scale(1.15); }
    </style>
</head>
<body>

<div class="container">
    <div class="topo">
        <form action="/painel" method="GET" class="busca">
            <input type="text" name="pesquisa" placeholder="Buscar prontuário, nome...">
            <button type="submit">🔍</button>
        </form>
        
        <div class="ferramentas">
            <form action="/importar" method="POST" enctype="multipart/form-data" id="formImport" style="display: none;">
                <input type="file" id="arquivoExcel" name="planilha" accept=".xlsx, .xls" onchange="document.getElementById('formImport').submit()">
            </form>
            <button class="btn btn-acao" onclick="document.getElementById('arquivoExcel').click()">📥 Importar</button>
            <a href="/exportar" class="btn btn-acao">📤 Exportar</a>
            <a href="/cadastrar" class="btn btn-novo">+ Novo Registro</a>
        </div>
    </div>

    <div class="grid">
        {% for p in pessoas %}
        <div class="card" onclick="window.location.href='/detalhes/{{ p.id }}'">
            <img src="{{ p.foto_url }}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'" alt="Foto">
            <div class="info">
                <h3>{{ p.nome }}</h3>
                <p>Unidade: {{ p.documento }}</p>
                <p class="prontuario">Prontuário: #{{ p.numero_prontuario }}</p>
            </div>
            
            <div class="acoes-card">
                <a href="/editar/{{ p.id }}" class="btn-editar" onclick="event.stopPropagation()">✏️</a>
                <form action="/excluir/{{ p.id }}" method="POST" onsubmit="return confirm('Excluir?')" onclick="event.stopPropagation()" style="display:inline;">
                    <button type="submit" class="btn-lixeira">🗑️</button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
