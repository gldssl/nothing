<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Novo Registro</title>
    <style>
        body { background: #0f1015; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 40px 20px;}
        .form-box { background: #1e1e28; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid #2d2d3a; }
        h2 { margin-top: 0; color: #4f46e5; text-align: center;}
        
        .grupo { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #1a1b23; border: 1px solid #333; border-radius: 6px; color: white; box-sizing: border-box; outline: none;}
        input:focus { border-color: #4f46e5; }
        
        .upload-file { padding: 10px; border: 1px dashed #4f46e5; background: rgba(79, 70, 229, 0.1); cursor: pointer; text-align: center; border-radius: 6px;}
        
        button { width: 100%; padding: 15px; background: #4f46e5; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;}
        button:hover { background: #4338ca; }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Registrar Detento</h2>
    
    <form action="/cadastrar" method="POST" enctype="multipart/form-data" onsubmit="return bloquearNomesFalsos(event)">
        
        <div class="grupo">
            <label>Selecione a Foto (.jpg, .png)</label>
            <input type="file" name="foto" class="upload-file" accept=".jpg, .jpeg, .png" required>
        </div>

        <div class="grupo">
            <label>Nome Completo (Apenas Letras)</label>
            <input type="text" id="nome" name="nome" pattern="^[A-Za-zÀ-ÖØ-öø-ÿ\s]+$" title="Números não são permitidos no nome" required autocomplete="off">
        </div>

        <div class="grupo" style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Nº do Prontuário</label>
                <input type="text" name="numero_prontuario" pattern="\d+" title="Apenas números permitidos" required>
            </div>
            <div style="flex: 1;">
                <label>Unidade Prisional de Origem</label>
                <input type="text" name="documento" required>
            </div>
        </div>

        <div class="grupo"><label>Familiar Próximo</label><input type="text" name="familiar"></div>
        <div class="grupo"><label>Motivo da Prisão</label><input type="text" name="motivo_prisao"></div>
        <div class="grupo" style="display: flex; gap: 10px;">
            <div style="flex: 1;"><label>Facção</label><input type="text" name="faccao"></div>
            <div style="flex: 1;"><label>Cela/Bloco</label><input type="text" name="cela_bloco"></div>
        </div>
        <div class="grupo"><label>Informações Médicas</label><input type="text" name="prontuario_medico"></div>

        <button type="submit">Salvar Registro</button>
        <a href="/painel" style="display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; font-size: 14px;">Cancelar</a>
    </form>
</div>

<script>
    function bloquearNomesFalsos(event) {
        const nome = document.getElementById("nome").value;
        const regexVogais = /[aeiouAEIOUáéíóúãõâêîôû]/;
        
        if (!regexVogais.test(nome)) {
            alert("Nome inválido! Por favor, insira um nome real.");
            event.preventDefault(); 
            return false;
        }
    }
</script>

</body>
</html>
